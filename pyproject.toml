[project]
name = "dynamic-tdma-sim"
version = "1.0.0"
description = "Simulator of dynamic TDMA scheduling for convergecast in wireless sensor networks"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
